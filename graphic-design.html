<div class="lightbox" id="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <span class="lightbox-nav lightbox-prev" onclick="event.stopPropagation(); showPrev()">&#10094;</span>
  <img id="lightbox-img" src="" alt="">
  <span class="lightbox-nav lightbox-next" onclick="event.stopPropagation(); showNext()">&#10095;</span>
</div>

<script>
const galleryImages = [
  { src: 'images/graphic/othello_evak.jpg', alt: 'Othello poster' },
  { src: 'images/graphic/animalfarm_evak.png', alt: 'Animal Farm poster' },
  { src: 'images/graphic/tothelighthouse_evak.jpg', alt: 'To The Lighthouse poster' },
  { src: 'images/graphic/eruditt101.png', alt: 'Erudite Games first poster' },
  { src: 'images/graphic/basketball_evak.png', alt: 'Basketball poster' },
  { src: 'images/graphic/alchemistfinal_evak.png', alt: 'The Alchemist poster' },
  { src: 'images/graphic/bell_jar_evak.png', alt: 'The Bell Jar poster' },
  { src: 'images/graphic/apelsin_evak.jpg', alt: 'Orange trimming poster' },
  { src: 'images/graphic/thegreatgatsby_evak.png', alt: 'The Great Gatsby poster' },
  { src: 'images/graphic/eruditu_dec_evak.png', alt: 'Erudite Games second poster' },
  { src: 'images/graphic/doriangray_evak.png', alt: 'Dorian Gray poster' },
  { src: 'images/graphic/metamorphosis.jpg', alt: 'Metamorphosis poster' },
  { src: 'images/graphic/valleyofthedolls_evak.jpeg', alt: 'Valley of the Dolls poster' },
  { src: 'images/graphic/restandrelaxation_evak.jpeg', alt: 'Rest and Relaxation poster' },
  { src: 'images/graphic/christmas_book.png', alt: 'Christmas book club poster' }
];
let currentIndex = 0;

function showImage(index){
  currentIndex = (index + galleryImages.length) % galleryImages.length;
  const item = galleryImages[currentIndex];
  const img = document.getElementById('lightbox-img');
  img.src = item.src;
  img.alt = item.alt;
}
function openLightbox(index){
  showImage(index);
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
}
function showNext(){ showImage(currentIndex + 1); }
function showPrev(){ showImage(currentIndex - 1); }

document.getElementById('lightbox').addEventListener('click', closeLightbox);
document.addEventListener('keydown', function(e){
  if(!document.getElementById('lightbox').classList.contains('open')) return;
  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowRight') showNext();
  if(e.key === 'ArrowLeft') showPrev();
});
</script>

<section class="book-carousel" id="book-covers">
  <div class="wrap">
    <h2 class="block-heading">Book Cover Design</h2>
    <div class="book-carousel-main">
      <span class="book-carousel-nav book-carousel-prev" onclick="bookPrev()">&#10094;</span>
      <img id="book-carousel-img" src="images/books/othello_book.png" alt="Othello book cover">
      <span class="book-carousel-nav book-carousel-next" onclick="bookNext()">&#10095;</span>
    </div>
    <div class="book-carousel-thumbs" id="book-carousel-thumbs"></div>
  </div>
</section>

<script>
const bookCovers = [
  { src: 'images/books/othello_book.png', alt: 'Othello book cover' },
  { src: 'images/books/room_of_ones_own.png', alt: 'A Room of One\'s Own book cover' },
  { src: 'images/books/scarlet_letter.png', alt: 'The Scarlet Letter book cover' },
  { src: 'images/books/variable_cloud.png', alt: 'Variable Cloud book cover' },
  { src: 'images/books/yearofmagicalthinking.png', alt: 'The Year of Magical Thinking book cover' }
];
let bookIndex = 0;
let bookTimer = null;

const bookImg = document.getElementById('book-carousel-img');
const bookThumbsWrap = document.getElementById('book-carousel-thumbs');

bookCovers.forEach((cover, i) => {
  const thumb = document.createElement('img');
  thumb.src = cover.src;
  thumb.alt = cover.alt;
  thumb.className = 'book-carousel-thumb' + (i === 0 ? ' active' : '');
  thumb.onclick = () => bookGoTo(i, true);
  bookThumbsWrap.appendChild(thumb);
});

function bookGoTo(index, manual){
  bookIndex = (index + bookCovers.length) % bookCovers.length;
  const cover = bookCovers[bookIndex];
  bookImg.style.opacity = 0;
  setTimeout(() => {
    bookImg.src = cover.src;
    bookImg.alt = cover.alt;
    bookImg.style.opacity = 1;
  }, 150);
  [...bookThumbsWrap.children].forEach((t, i) => {
    t.classList.toggle('active', i === bookIndex);
  });
  if(manual) restartBookTimer();
}
function bookNext(){ bookGoTo(bookIndex + 1, true); }
function bookPrev(){ bookGoTo(bookIndex - 1, true); }

function restartBookTimer(){
  clearInterval(bookTimer);
  bookTimer = setInterval(() => bookGoTo(bookIndex + 1, false), 5000);
}
restartBookTimer();
</script>
