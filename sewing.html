<div class="lightbox" id="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <span class="lightbox-nav lightbox-prev" onclick="event.stopPropagation(); showPrev()">&#10094;</span>
  <img id="lightbox-img" src="" alt="">
  <span class="lightbox-nav lightbox-next" onclick="event.stopPropagation(); showNext()">&#10095;</span>
</div>

<script>
const galleryImages = [
  { src: 'images/sewing/pinkset_evak.png', alt: 'Pink sewn set' },
  { src: 'images/sewing/purpleset_evak.png', alt: 'Purple sewn set' },
  { src: 'images/sewing/reddress_evak.png', alt: 'Red dress' },
  { src: 'images/sewing/checkerset_evak.png', alt: 'Checker print set' },
  { src: 'images/sewing/blueset_evak.png', alt: 'Blue jumpsuit' },
  { src: 'images/sewing/blackdress_evak.png', alt: 'Black mesh dress' },
  { src: 'images/sewing/dotdress_evak.png', alt: 'Dot print dress' },
  { src: 'images/sewing/blacktop_evak.png', alt: 'Black mesh top' },
  { src: 'images/sewing/brownset_evak.png', alt: 'Brown knit set' }
];
let currentIndex = 0;

function showImage(index){
  currentIndex = (index + galleryImages.length) % galleryImages.length;
  const item = galleryImages[currentIndex];
  const img = document.getElementById('lightbox-img');
  img.src = item.src;
  img.alt = item.alt;
}
function openLightbox(index){
  showImage(index);
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
}
function showNext(){ showImage(currentIndex + 1); }
function showPrev(){ showImage(currentIndex - 1); }

document.getElementById('lightbox').addEventListener('click', closeLightbox);
document.addEventListener('keydown', function(e){
  if(!document.getElementById('lightbox').classList.contains('open')) return;
  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowRight') showNext();
  if(e.key === 'ArrowLeft') showPrev();
});
</script>
